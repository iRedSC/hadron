# Who sits on the council and what passes. Read by the council skill (.claude/skills/council/SKILL.md) to start its
# delegates and by the gate (.github/scripts/council_gate.py) to check the PR's "Council review" table, so the two
# can't disagree. Two providers (Claude and Codex), a large and a small model from each.
#
# Three roles:
# - "deep": reviews the change in full and scores it out of 10. Its last round must score at least min_score.
# - "questions": a small model told to ask dumb questions about why the code was done this way. It doesn't score; it
#   records "<asked> asked, <open> open", and passes when no question is left open (each answered in the PR, or the
#   code changed so the question no longer applies).
# - "explain": an old, small model that explains what changed and how it works, from the code alone. The author marks
#   each place the explanation is wrong; it records "<misread> misread, <open> open", and passes when none is open:
#   a misreading the code caused is fixed in the code, one from the model's own limits is answered in the PR.
#
# Options go to delegate_task as given: `effort` for Claude models that have it, `reasoningEffort` for Codex models,
# `thinking` for Claude models whose only option is thinking on or off.

# Every deep reviewer's score in the last round must be at least this, out of 10.
min_score = 8

[[member]]
name = "GPT-6.1 Sol"
role = "deep"
provider = "codex"
model = "gpt-6.1-sol"
reasoningEffort = "high"

[[member]]
name = "Claude Opus 5.5"
role = "deep"
provider = "claudeAgent"
model = "claude-opus-5-5"
effort = "medium"

[[member]]
name = "Claude Haiku 5.5"
role = "questions"
provider = "claudeAgent"
model = "claude-haiku-5-5"
effort = "medium"

[[member]]
name = "GPT-6.1 Terra"
role = "questions"
provider = "codex"
model = "gpt-6.1-terra"
reasoningEffort = "high"

[[member]]
name = "Claude Haiku 4.5"
role = "explain"
provider = "claudeAgent"
model = "claude-haiku-4-5"
# Haiku 4.5's only option is thinking, kept on.
thinking = true

[[member]]
name = "GPT-6 Luna"
role = "explain"
provider = "codex"
model = "gpt-6-luna"
reasoningEffort = "low"
