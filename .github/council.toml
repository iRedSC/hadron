# Who reviews a hard-to-undo change, and when it's done. Read by the three skills (.claude/skills/questions,
# council, explain) to start their delegates, and by the gate (.github/scripts/council_gate.py) to check the record.
#
# Order: one pass of questions, then council rounds, then one explain pass and cleanup, then a final review only when
# the cleanup changed more than `cleanup_lines` lines of code.

# A council round must have each member find at least this many issues.
min_findings = 3
# The council stops after the first round in which no member finds anything above this priority, or after max_rounds.
stop_at = "P3"
max_rounds = 5
# Code lines (not .md) changed after the council's last round, above which the final reviewer must review the head.
cleanup_lines = 40
# The final reviewer's passing score, out of 10.
min_score = 8

