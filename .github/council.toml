# Who reviews a hard-to-undo change. Every protected PR gets the final review (.claude/skills/final-review), which the
# gate (.github/scripts/council_gate.py) checks. Sizable changes whose effect is hard to measure also get the full
# council first (.claude/skills/council): one pass of questions, council rounds, one explain pass and cleanup.

# A council round must have each member find at least this many issues.
min_findings = 3
# The council stops after the first round in which no member finds anything more serious than this priority (P0 is
# the most serious). If max_rounds pass without that, the gate fails and the owner decides what's next. The final
# review must reach the same priority.
stop_at = "P3"
max_rounds = 5

