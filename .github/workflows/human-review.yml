# A PR touching a path in .github/human-review-paths.txt fails this check until the owner adds the `human-reviewed`
# label. A new commit removes the label, because a review covers the commits it saw, not ones pushed after.
#
# pull_request_target runs this file, the script and the path list as they are on main, never the PR's copies, so a
# PR can't loosen its own gate. The PR is only read as diff data; none of its code runs here.
name: Human review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the PR's commits, as data only
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "pull/$PR/head" "$BASE_REF"
      - name: Drop a review that predates this commit
        if: github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'human-reviewed')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr edit "$PR" -R "$REPO" --remove-label human-reviewed
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # On synchronize the label was just removed above, so it no longer counts.
          REVIEWED: ${{ github.event.action != 'synchronize' && contains(github.event.pull_request.labels.*.name, 'human-reviewed') }}
        run: python3 .github/scripts/human_review.py
