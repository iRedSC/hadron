# A release must pass both tiers: the fast build, then every in-game suite, each in its own headless server.
# Runs on a version tag (v0.2.0) or by hand from the Actions tab. Suites run one after another, never in parallel.
name: Release check

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - run: ./gradlew build
      - run: ./gradlew :examples:hello:hadronTest
      - run: ./gradlew :selftest:hadronTest
      - name: Keep reports and server logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hadron-test
          path: |
            neoforge/build/hadron-test/report.*
            neoforge/build/hadron-test/run/logs/
            **/build/reports/tests/
          if-no-files-found: ignore
