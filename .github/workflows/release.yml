# A release must pass both tiers: the fast build, then every in-game suite, each in its own headless server.
# Runs on a version tag (v0.2.0) or by hand from the Actions tab. Suites run one after another, never in parallel.
name: Release check

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      # build runs check, and with it releaseJarCheck: the mod jar server owners get must hold no test code. Named
      # here too, so the release can't lose it if check's wiring changes.
      - run: ./gradlew build :neoforge:releaseJarCheck
      - run: ./gradlew :examples:hello:hadronTest
      - run: ./gradlew :selftest:hadronTest
      - name: Keep reports and server logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hadron-test
          path: |
            neoforge/build/hadron-test/report.*
            neoforge/build/hadron-test/run/logs/
            **/build/reports/tests/
          if-no-files-found: ignore

  # Every fixed bug stays fixed: each fix in regressions/regressions.toml is undone in a throwaway worktree and its
  # guard tests must fail (docs/testing.md, "Regression replay"). Each in-game entry boots a server, so this is slow
  # and runs for releases only, after the plain checks pass.
  # Six machines replay a sixth each, in parallel: each in-game entry boots its own server, so one machine takes
  # about 12 minutes.
  regressions:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a patch that no longer applies falls back to a three-way merge, which needs old blobs.
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - run: python3 scripts/regression_replay.py --shard ${{ matrix.shard }}/6
      - name: Keep the replay's report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-replay-${{ matrix.shard }}
          path: |
            build/regression-replay/report.json
            build/regression-replay/logs/
          if-no-files-found: ignore
