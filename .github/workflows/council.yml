# A PR touching a path in .github/council-paths.txt fails this check until its description carries a passing council
# review of its head commit (.github/scripts/council_gate.py). A push or a description edit reruns it.
#
# pull_request_target runs this file, the script, the path list and the member list as they are on main, never the
# PR's copies, so a PR can't loosen its own gate. The PR is only read as data; none of its code runs here.
name: Council

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the PR's commits, as data only
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "pull/$PR/head" "$BASE_REF"
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # Passed through the environment, never pasted into the script, so a description can't inject shell.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/council_gate.py
