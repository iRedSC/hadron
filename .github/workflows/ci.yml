# Every PR and every push to main: compile, the fast test tier, and the coverage check (./gradlew build runs all three,
# with no server). The in-game tier boots servers, so it runs for releases instead (release.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only main writes the cache, so a PR can't poison what every later run reads.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew build
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
