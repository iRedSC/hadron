# Every PR and every push to main: compile, the fast test tier, and the coverage check (./gradlew build runs all three,
# with no server). The in-game tier boots servers, so it runs for releases instead (release.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Only main writes the cache, so a PR can't poison what every later run reads.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew build
      # The council gate's own tests: they catch a change that breaks the gate by mistake. (A PR can edit these too;
      # what stops a PR loosening its own gate is that council.yml runs main's copy.)
      - run: python3 -m unittest discover -s .github/scripts
      # The blind-test bundle rewrites docs by exact text, so a doc edit can break it; build it on every PR to know.
      - run: ./gradlew contractBundle
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
