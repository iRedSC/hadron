# Every bug Hadron has fixed, the patch that undoes its fix, and the tests that must fail without it.
# `python3 scripts/regression_replay.py` applies each regressions/<id>.patch in a
# throwaway worktree and runs the entry's guards; every guard must FAIL. See docs/testing.md, "Regression replay".
#
#   id         names the patch file, regressions/<id>.patch
#   bug        what went wrong, in one line
#   fix        the commit the fix landed in; `refresh <id> --from-fix` derives the patch from it and `paths`
#   paths      the fix's files that the patch undoes
#   guards     tests that fail without the fix: { test = "Class.method", tier = "fast" | "in-game" }
#   unguarded  instead of guards: why no test can guard it (the replay lists it and doesn't fail on it)
#   note       how the patch differs from a plain revert of `paths`, for whoever refreshes it
#
# A bug fix adds its entry here in the same change (docs/coding-standards.md, "Growing this file").


# ---- Found by the PR #9 review ----


