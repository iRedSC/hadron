modLoader="javafml"
loaderVersion="[1,)"
license="MIT"

[[mods]]
modId="hadron_test"
version="${hadron_version}"
displayName="Hadron test harness"
description='''
Runs plugins' @HadronTests on a headless server. Only Hadron's test server loads it; never install it on a real one.
'''

[[dependencies.hadron_test]]
    modId="hadron"
    type="required"
    versionRange="[${hadron_version}]"
    ordering="AFTER"
    side="BOTH"

# A mod with nothing in it, which the harness claims as a bridge from its constructor, so self-tests see a claim made
# the way a real bridge makes one.
[[mods]]
modId="hadron_test_target"
version="${hadron_version}"
displayName="Hadron test bridge target"
description='''
Nothing: the mod Hadron's test harness claims as a bridge, so its tests see a real claim.
'''

[[mixins]]
    config="hadron_test.mixins.json"
